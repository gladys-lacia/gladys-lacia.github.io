<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Translate | Gladys Lacia</title>
  <link rel="icon" type="image/png" href="../assets/gdlcfavicon2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="tools-assets/translate.css" />
</head>
<body>

  <!-- Login: shown before anyone can enter the tool -->
  <div id="loginView" class="login-view">
    <form id="loginForm" class="login-card">
      <h1>Translate</h1>
      <p class="login-note">Log in to continue. Accounts are created by the site owner.</p>
      <label class="field">Username or email
        <input id="loginIdentifier" type="text" autocomplete="username" required />
      </label>
      <label class="field">Password
        <input id="loginPassword" type="password" autocomplete="current-password" required />
      </label>
      <p id="loginError" class="form-error" role="alert" hidden></p>
      <button id="loginSubmit" class="btn btn-primary" type="submit">Log in</button>
    </form>
  </div>

  <!-- Tool -->
  <div id="appView" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button id="newTabButton" class="btn btn-new" type="button">+ New translation</button>
      </div>
      <nav id="tabList" class="tab-list" aria-label="Translation tabs"></nav>
      <div class="sidebar-bottom">
        <button id="logoutButton" class="btn-logout" type="button">Log out</button>
        <span id="userLabel" class="user-label"></span>
      </div>
    </aside>

    <main class="conversation">
      <header class="conv-header">
        <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 3.5v13"/></svg>
        </button>
        <label class="mode-picker">
          <span class="sr-only">Translation mode</span>
          <select id="modeSelect"></select>
        </label>
        <div class="settings-wrap">
          <button id="settingsButton" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="menu" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
          </button>
          <div id="settingsMenu" class="settings-menu" role="menu" hidden>
            <button id="clearButton" type="button" role="menuitem">Clear conversation</button>
            <button id="deleteTabButton" type="button" role="menuitem">Delete tab</button>
          </div>
        </div>
      </header>

      <p id="pageError" class="page-error" role="alert" hidden></p>
      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="composer" class="composer">
        <label class="sr-only" for="inputText">Text to translate</label>
        <textarea id="inputText" rows="1" placeholder="Type or paste text to translate (Ctrl+Enter to send)"></textarea>
        <button id="translateButton" class="btn btn-primary" type="submit">Translate</button>
      </form>
    </main>
  </div>

  <!-- Clear confirmation -->
  <dialog id="clearDialog" class="dialog">
    <form id="clearForm">
      <h2>Clear this conversation?</h2>
      <p>This permanently deletes every message in this tab, including from the database. Your prompts are not affected.</p>
      <label class="field">Type CLEAR to confirm
        <input id="clearPhrase" type="text" autocomplete="off" />
      </label>
      <p id="clearError" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="clearCancel" class="btn" type="button">Cancel</button>
        <button id="clearConfirm" class="btn btn-danger" type="submit" disabled>Clear conversation</button>
      </div>
    </form>
  </dialog>

  <script src="tools-assets/translate.js" defer></script>
</body>
</html>
