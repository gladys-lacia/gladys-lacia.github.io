<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio Archive &colon; Gladys Lacia</title>
  <meta
    name="description"
    content="Archive of previous versions of the portfolio of Gladys Lacia."
  />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../assets/gdlcfavicon2.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#4A0404" />

  <style>
    /* Styles live in this file on purpose: no external stylesheet. */

    :root {
      --maroon: #4A0404;
      --forest: #274A04;
      --teal: #044A4A;
      --plum: #27044A;
      --cream: #FFFEF2;
      --ink: #2e2d2b;
      --line: rgba(46, 45, 43, 0.13);
      --shadow: 0 1px 2px rgba(46, 45, 43, 0.06), 0 10px 28px rgba(46, 45, 43, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cream);
      background-image: linear-gradient(180deg, rgba(74, 4, 4, 0.07), rgba(255, 254, 242, 0) 380px);
      background-repeat: no-repeat;
      color: var(--ink);
      font-family: 'Lato', sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .document {
      max-width: 880px;
      margin: 40px auto 56px;
      padding: 0 24px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 34px 36px;
      margin-bottom: 28px;
      border-radius: 16px;
      color: var(--cream);
      background: linear-gradient(135deg, var(--maroon) 0%, var(--plum) 100%);
      box-shadow: 0 14px 34px rgba(74, 4, 4, 0.28);
      animation: gd-rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .profile-image {
      width: 104px;
      height: 104px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--cream);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    .header p {
      margin-top: 10px;
      opacity: 0.92;
    }

    /* Section card */
    .section {
      margin-bottom: 28px;
      padding: 28px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .section h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      color: var(--teal);
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    /* Links */
    a {
      color: var(--maroon);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--teal);
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .page-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .page-links a {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--teal);
      text-decoration: none;
    }

    .page-links a:hover {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--cream);
    }

    /* Archive list */
    .archive-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .archive-item {
      display: block;
      padding: 16px 20px;
      background: rgba(39, 4, 74, 0.035);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .archive-item:hover {
      background: rgba(4, 74, 74, 0.07);
      border-color: var(--teal);
      color: var(--ink);
    }

    .archive-title {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      color: var(--maroon);
    }

    .archive-date {
      display: block;
      font-size: 0.9rem;
    }

    @keyframes gd-rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 600px) {
      .document {
        padding: 0 16px;
        margin-top: 24px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        padding: 24px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .section {
        padding: 22px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .header { animation: none; }
      a, .archive-item { transition: none; }
    }

    @media print {
      body { background-image: none; }
      .header { background: none; box-shadow: none; padding: 0; color: var(--ink); animation: none; }
      .header h1 { color: var(--maroon); }
      .profile-image { border: 0; border-radius: 4px; box-shadow: none; }
      .page-links { display: none; }
      .section { box-shadow: none; }
    }
  </style>
</head>
<body>

  <main class="document">

    <header class="header">
      <img
        src="../../assets/gdlcprofilepicture1.jpg"
        alt="Gladys Lacia profile photo"
        class="profile-image"
      />

      <div class="header-text">
        <h1>Portfolio Archive</h1>
        <p>Archive of previous versions of my portfolio.</p>
      </div>
    </header>

    <nav class="page-links" aria-label="Site pages">
      <a href="../">&larr; Current portfolio</a>
      <a href="../../">Home</a>
    </nav>

    <section class="section">
      <h2>Previous Versions</h2>

      <!--
        To add an archived version:
        1. Copy one <li> block below and paste it at the end of the list.
        2. Change href to the folder or file of that version.
        3. Change the title and date text.
        Delete the two placeholder entries once your real versions are in.
      -->
      <ul class="archive-list">
        <li>
          <a class="archive-item" href="./version-2/">
            <span class="archive-title">Version 2</span>
            <span class="archive-date">Month Year</span>
          </a>
        </li>
        <li>
          <a class="archive-item" href="./version-1/">
            <span class="archive-title">Version 1</span>
            <span class="archive-date">Month Year</span>
          </a>
        </li>
      </ul>
    </section>

  </main>

</body>
</html>
